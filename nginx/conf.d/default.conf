# =====================================================================
# ShieldCaptcha Enterprise NGINX Reverse Proxy Configuration
# =====================================================================

upstream backend_upstream {
    server backend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP Server (Redirects to HTTPS in production, or serves directly)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Standalone Embeddable Script Delivery (High Cache, Fast Edge Delivery)
    location ~ ^/(captcha\.js|widget\.js)$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Core Defense API Endpoints (Hardened with rate limiting & real IP forwarding)
    location /api/ {
        limit_req zone=captcha_api burst=50 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Next.js Static Optimization Assets
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Developer Portal and UI Routes (Next.js App Router)
    location / {
        limit_req zone=general_limit burst=100 nodelay;

        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

