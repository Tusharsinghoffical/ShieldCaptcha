name: CI - Lint, Test & Container Build

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Run Next.js Production Build Check
        run: |
          npm --prefix frontend run build

      - name: Run Technical SEO & Indexing Audit
        run: |
          npm --prefix frontend run seo:check

      - name: Validate Backend Engine Health & Syntax
        run: |
          node -c backend-node/server.js
          node backend-node/server.js &
          BACKEND_PID=$!
          sleep 3
          curl -f http://127.0.0.1:3000/api/health || exit 1
          kill $BACKEND_PID

  docker-build-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: false
          tags: shieldcaptcha-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: shieldcaptcha-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
