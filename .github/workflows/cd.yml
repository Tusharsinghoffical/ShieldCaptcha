name: CD - Automated Production Server Deployment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deployment Mode"
        required: true
        default: "docker-compose-prod"
        type: choice
        options:
          - "docker-compose-prod"
          - "docker-compose-standard"
          - "pm2-rolling-update"

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  publish-containers:
    name: Build & Push GHCR Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Backend Engine
      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker metadata for Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Build and push Next.js Frontend
      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Deploy to Remote Production Server
    runs-on: ubuntu-latest
    needs: [publish-containers]
    if: ${{ github.repository != '' }}

    steps:
      - name: Check for Server SSH Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.SERVER_HOST }}" ] && [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Target host configured: ${{ secrets.SERVER_HOST }}"
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::notice ::SSH credentials not yet configured in GitHub Repository Secrets. Skipping remote SSH execution. Add SERVER_HOST, SERVER_USER, and SSH_PRIVATE_KEY to enable auto-deploy."
          fi

      - name: Execute Remote SSH Deployment
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 120s
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/var/www/shieldcaptcha' }}"
            echo "[CD] Deploying to $DEPLOY_PATH on $(hostname)..."

            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "[CD] Initializing repository clone at $DEPLOY_PATH..."
              mkdir -p "$DEPLOY_PATH"
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            echo "[CD] Pulling latest main branch..."
            git fetch --all
            git reset --hard origin/main

            # Ensure .env exists with cryptographic secrets
            if [ ! -f ".env" ]; then
              echo "[CD] Generating production keys..."
              if command -v node > /dev/null; then
                node scripts/generate-keys.js --write
              else
                cp .env.example .env
              fi
            fi

            # Execute deployment
            echo "[CD] Triggering rolling container update..."
            if [ "${{ github.event.inputs.deploy_mode }}" == "docker-compose-standard" ]; then
              docker compose up -d --build --remove-orphans
            elif [ "${{ github.event.inputs.deploy_mode }}" == "pm2-rolling-update" ]; then
              npm install
              npm run build
              pm2 restart ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            else
              docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            fi

            # Healthcheck Verification
            echo "[CD] Running post-deploy health check..."
            sleep 5
            for i in {1..10}; do
              if curl -s http://127.0.0.1:3000/api/health | grep -q "healthy"; then
                echo "[CD] Backend health verification passed!"
                exit 0
              fi
              echo "Waiting for backend health check ($i/10)..."
              sleep 3
            done

            echo "[CD] Warning: Backend took longer than expected to report healthy."
